<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuref · 众筹出单渠道工具箱</title>
  <meta name="description" content="Kickstarter / IGG / Makuake 三平台出单渠道分析工具统一入口">
  <meta name="theme-color" content="#f5f6f8">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      background:#f5f6f8;color:#1f2937;min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:40px 20px;
    }
    .wrap{width:100%;max-width:960px}
    .hero{text-align:center;margin-bottom:36px}
    .logo{
      width:52px;height:52px;border-radius:14px;margin:0 auto 14px;
      background:linear-gradient(135deg,#05ce78 0%,#05ce78 33%,#eb1478 33%,#eb1478 66%,#f7c600 66%);
      box-shadow:0 4px 14px rgba(31,41,55,.12);
    }
    .hero h1{font-size:24px;font-weight:800;letter-spacing:.5px}
    .hero .sub{margin-top:8px;color:#8a94a6;font-size:14px}
    .grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;
    }
    .card{
      display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e6e9ee;
      border-radius:16px;padding:22px 22px 18px;position:relative;overflow:hidden;
      transition:transform .15s ease,box-shadow .15s ease;
    }
    .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(31,41,55,.10)}
    .card.ks::before{background:#05ce78}
    .card.igg::before{background:#eb1478}
    .card.mk::before{background:#f7c600}
    .plat{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .card.ks .dot{background:#05ce78}
    .card.igg .dot{background:#eb1478}
    .card.mk .dot{background:#f7c600;border:1px solid #e0b400}
    .pname{font-weight:800;font-size:16px}
    .plang{margin-left:auto;font-size:11px;color:#b0b8c4;letter-spacing:.3px}
    .proj{color:#8a94a6;font-size:12.5px;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .metric{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .amount{font-size:26px;font-weight:800;letter-spacing:.3px}
    .amount.empty{color:#c3cad4;font-size:20px;font-weight:700}
    .count{color:#5b6770;font-size:13px;font-weight:600}
    .mlabel{color:#b0b8c4;font-size:11px;margin-right:2px}
    .date{margin-top:10px;color:#b0b8c4;font-size:12px}
    .date.empty{color:#c3cad4}
    .go{
      margin-top:14px;display:inline-flex;align-items:center;gap:6px;
      font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;color:#fff;
    }
    .card.ks .go{background:#05ce78}
    .card.igg .go{background:#eb1478}
    .card.mk .go{background:#f7c600;color:#3a2c00}
    .foot{text-align:center;color:#b0b8c4;font-size:12px;margin-top:30px}
  </style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="logo"></div>
    <h1>Yuref 工具箱</h1>
    <p class="sub">Kickstarter · IGG · Makuake 出单渠道分析 · 数据仅存于本机浏览器</p>
  </header>

  <section class="grid">
    <a class="card ks" href="report_tool.html" id="cardKS">
      <div class="plat"><span class="dot"></span><span class="pname">Kickstarter</span><span class="plang">KS</span></div>
      <div class="proj" id="ksProj">—</div>
      <div class="metric"><span class="mlabel">累计金额</span><span class="amount empty" id="ksAmt">暂无数据</span></div>
      <div class="count" id="ksCnt"></div>
      <div class="date empty" id="ksDate">进入后导入数据即自动保存</div>
      <div class="go">进入工具 →</div>
    </a>

    <a class="card igg" href="igg_tool.html" id="cardIGG">
      <div class="plat"><span class="dot"></span><span class="pname">IGG</span><span class="plang">IGG</span></div>
      <div class="proj" id="iggProj">—</div>
      <div class="metric"><span class="mlabel">累计金额</span><span class="amount empty" id="iggAmt">暂无数据</span></div>
      <div class="count" id="iggCnt"></div>
      <div class="date empty" id="iggDate">进入后导入数据即自动保存</div>
      <div class="go">进入工具 →</div>
    </a>

    <a class="card mk" href="makuake_tool.html" id="cardMK">
      <div class="plat"><span class="dot"></span><span class="pname">Makuake</span><span class="plang">MK</span></div>
      <div class="proj" id="mkProj">—</div>
      <div class="metric"><span class="mlabel">累计收益</span><span class="amount empty" id="mkAmt">暂无数据</span></div>
      <div class="count" id="mkCnt"></div>
      <div class="date empty" id="mkDate">进入后导入数据即自动保存</div>
      <div class="go">进入工具 →</div>
    </a>
  </section>

  <p class="foot">卡片数值为各平台工具最近一次导入数据的累计快照 · 刷新即读取最新</p>
</main>

<script>
(function(){
  'use strict';
  var CUR_SYMBOL={USD:'$',JPY:'¥',HKD:'HK$'};
  function lsJSON(k){
    try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; }
  }
  function fmtAmount(v,cur){
    var sym=CUR_SYMBOL[cur]||'$';
    return sym+Math.round(v).toLocaleString('en-US');
  }
  function fill(prefixId,info,labels){
    var elAmt=document.getElementById(prefixId+'Amt'),
        elCnt=document.getElementById(prefixId+'Cnt'),
        elDate=document.getElementById(prefixId+'Date'),
        elProj=document.getElementById(prefixId+'Proj');
    if(!info){
      elProj.textContent='—';
      return;
    }
    elProj.textContent=info.proj||'—';
    elAmt.textContent=fmtAmount(info.amount,info.cur);
    elAmt.classList.remove('empty');
    elCnt.innerHTML='<span class="mlabel">'+labels.count+'</span>'+(info.count||0).toLocaleString('en-US');
    elDate.textContent='更新至 '+(info.date||'—');
    elDate.classList.remove('empty');
  }

  /* KS：ks_ref_data_v1_<proj> = {currency, snapshots:[{date, totals:{类:{ref:[单量,金额]}}}]} */
  function ksInfo(){
    var P='ks_ref_data_v1_', best=null;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||k.indexOf(P)!==0) continue;
      var d=lsJSON(k);
      if(!d||!Array.isArray(d.snapshots)||!d.snapshots.length) continue;
      var snap=null;
      for(var j=0;j<d.snapshots.length;j++){
        var s=d.snapshots[j];
        if(s&&s.date&&(!snap||s.date>snap.date)) snap=s;
      }
      if(!snap) continue;
      var pl=0,am=0,totals=snap.totals||{};
      for(var c in totals){
        var grp=totals[c];
        for(var r in grp){ pl+=(grp[r][0]||0); am+=(grp[r][1]||0); }
      }
      var info={proj:k.slice(P.length),date:snap.date,amount:am,count:pl,cur:d.currency||'USD'};
      if(!best||info.date>best.date) best=info;
    }
    return best;
  }

  /* IGG / Makuake：<prefix>hist_v1_<proj> = {snapshots:[{date, links:{ref:{orders,total,...}}}]} */
  function histInfo(prefix,curFallback){
    var H=prefix+'hist_v1_', C=prefix+'currency_v1_', best=null;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||k.indexOf(H)!==0) continue;
      var h=lsJSON(k);
      if(!h||!Array.isArray(h.snapshots)||!h.snapshots.length) continue;
      var snap=null;
      for(var j=0;j<h.snapshots.length;j++){
        var s=h.snapshots[j];
        if(s&&s.date&&(!snap||s.date>snap.date)) snap=s;
      }
      if(!snap) continue;
      var cnt=0,am=0,links=snap.links||{};
      for(var n in links){ cnt+=(links[n].orders||0); am+=(links[n].total||0); }
      var proj=k.slice(H.length);
      var cur=localStorage.getItem(C+proj)||curFallback;
      var info={proj:proj,date:snap.date,amount:am,count:cnt,cur:cur};
      if(!best||info.date>best.date) best=info;
    }
    return best;
  }

  fill('ks',  ksInfo(),                      {count:'单量'});
  fill('igg', histInfo('igg_ref_','USD'),    {count:'订单'});
  fill('mk',  histInfo('makuake_ref_','JPY'),{count:'关键事件'});
})();
</script>
</body>
</html>
