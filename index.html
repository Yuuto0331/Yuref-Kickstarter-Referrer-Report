<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuref · 众筹出单渠道工具箱</title>
  <meta name="description" content="Kickstarter / Indiegogo / Makuake 三平台出单渠道分析工具统一入口">
  <meta name="theme-color" content="#ffffff">
  <style>
    /* ===== shadcn/ui 语义 token（neutral，亮/暗双模式） ===== */
    :root{
      --radius:0.625rem;
      --radius-sm:calc(var(--radius)*0.6);
      --radius-md:calc(var(--radius)*0.8);
      --radius-lg:var(--radius);
      --radius-xl:calc(var(--radius)*1.4);
      --radius-2xl:calc(var(--radius)*1.8);
      --background:oklch(1 0 0);
      --foreground:oklch(0.145 0 0);
      --card:oklch(1 0 0);
      --card-foreground:oklch(0.145 0 0);
      --primary:oklch(0.205 0 0);
      --primary-foreground:oklch(0.985 0 0);
      --secondary:oklch(0.97 0 0);
      --secondary-foreground:oklch(0.205 0 0);
      --muted:oklch(0.97 0 0);
      --muted-foreground:oklch(0.556 0 0);
      --accent:oklch(0.97 0 0);
      --accent-foreground:oklch(0.205 0 0);
      --border:oklch(0.922 0 0);
      --ring:oklch(0.708 0 0);
      /* 平台品牌色（仅点睛：圆点/徽标，不做大色块） */
      --ks:oklch(0.72 0.17 156);
      --igg:oklch(0.62 0.22 0);
      --mk:oklch(0.83 0.16 95);
    }
    .dark{
      --background:oklch(0.145 0 0);
      --foreground:oklch(0.985 0 0);
      --card:oklch(0.205 0 0);
      --card-foreground:oklch(0.985 0 0);
      --primary:oklch(0.922 0 0);
      --primary-foreground:oklch(0.205 0 0);
      --secondary:oklch(0.269 0 0);
      --secondary-foreground:oklch(0.985 0 0);
      --muted:oklch(0.269 0 0);
      --muted-foreground:oklch(0.708 0 0);
      --accent:oklch(0.269 0 0);
      --accent-foreground:oklch(0.985 0 0);
      --border:oklch(1 0 0 / 10%);
      --ring:oklch(0.556 0 0);
      --ks:oklch(0.75 0.17 156);
      --igg:oklch(0.68 0.2 0);
      --mk:oklch(0.85 0.15 95);
    }
    @media (prefers-color-scheme: dark){
      :root{ /* 跟随系统时等价 .dark */
        --background:oklch(0.145 0 0);
        --foreground:oklch(0.985 0 0);
        --card:oklch(0.205 0 0);
        --card-foreground:oklch(0.985 0 0);
        --primary:oklch(0.922 0 0);
        --primary-foreground:oklch(0.205 0 0);
        --secondary:oklch(0.269 0 0);
        --secondary-foreground:oklch(0.985 0 0);
        --muted:oklch(0.269 0 0);
        --muted-foreground:oklch(0.708 0 0);
        --accent:oklch(0.269 0 0);
        --accent-foreground:oklch(0.985 0 0);
        --border:oklch(1 0 0 / 10%);
        --ring:oklch(0.556 0 0);
        --ks:oklch(0.75 0.17 156);
        --igg:oklch(0.68 0.2 0);
        --mk:oklch(0.85 0.15 95);
      }
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body::before{
      content:"";position:fixed;inset:-15%;pointer-events:none;z-index:0;opacity:.22;
      background:
        radial-gradient(880px 600px at calc(12% + var(--mx,0)*5%) calc(-6% + var(--my,0)*4%), var(--ks) 0%, transparent 62%),
        radial-gradient(880px 600px at calc(88% - var(--mx,0)*5%) calc(-6% + var(--my,0)*4%), var(--igg) 0%, transparent 62%),
        radial-gradient(1000px 680px at calc(50% + var(--mx,0)*7%) calc(112% - var(--my,0)*5%), var(--mk) 0%, transparent 64%);
      animation:bgDrift 22s ease-in-out infinite alternate;
    }
    @keyframes bgDrift{
      0%{transform:translate3d(-1.2%,-1%,0) scale(1)}
      100%{transform:translate3d(1.2%,1.2%,0) scale(1.045)}
    }
    @media (prefers-reduced-motion: reduce){ body::before{animation:none} }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      background:var(--background);color:var(--foreground);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:40px 20px;
    }
    .wrap{width:100%;max-width:880px;position:relative;z-index:1}

    /* ===== Hero ===== */
    .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:34px}
    .badge{
      display:inline-flex;align-items:center;gap:5px;
      font-size:11.5px;font-weight:600;letter-spacing:.4px;
      color:var(--muted-foreground);
      border:1px solid var(--border);border-radius:9999px;
      padding:3px 12px;margin-bottom:14px;
    }
    .badge .bdot{width:6px;height:6px;border-radius:50%;display:inline-block}
    .bdot.ks{background:var(--ks)}
    .bdot.igg{background:var(--igg)}
    .bdot.mk{background:var(--mk)}
    h1{display:inline-flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-0.3px}
    .logomark{border-radius:10px;box-shadow:0 1px 3px oklch(0.145 0 0 / 16%);flex:none}
    h1 .thin{color:var(--muted-foreground);font-weight:600}
    .sub{margin-top:9px;color:var(--muted-foreground);font-size:13.5px}

    /* ===== 卡片（shadcn Card：rounded-xl border bg-card） ===== */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
    .card{
      display:flex;flex-direction:column;text-decoration:none;color:var(--card-foreground);
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius-xl);padding:20px;
      transition:border-color .15s ease,box-shadow .15s ease;
    }
    .card:hover{
      border-color:var(--ring);
      box-shadow:0 4px 16px oklch(0.145 0 0 / 8%);
    }
    .card-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .plogo{
      width:36px;height:36px;border-radius:var(--radius-md);flex:none;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:16px;color:#fff;
    }
    .plogo.ks{background:var(--ks)}
    .plogo.igg{background:var(--igg);font-size:11px;letter-spacing:.3px}
    .plogo.mk{background:var(--mk);color:#3a2c00}
    .plogo.imgmk{background:#fff;border:1px solid var(--border)}
    .plogo.imgmk img{width:27px;height:27px;display:block;border-radius:6px}
    .plogo.imgigg{background:#fff;border:1px solid var(--border)}
    .plogo.imgigg img{width:27px;height:27px;display:block;border-radius:6px}
    .dot{display:none}
    .pname{font-weight:600;font-size:15px;letter-spacing:-0.1px}
    .tag{
      margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.5px;
      color:var(--muted-foreground);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:2px 7px;
    }
    .card-foot{margin-top:auto}
    .go{
      display:inline-flex;align-items:center;gap:7px;
      font-size:13px;font-weight:500;color:var(--accent-foreground);
      border:1px solid var(--border);border-radius:var(--radius-md);
      padding:7px 14px;transition:background .15s ease;
    }
    .card:hover .go{background:var(--accent)}
    .go svg{flex:none}

    .foot{text-align:center;color:var(--muted-foreground);font-size:12px;margin-top:32px}
  </style>
</head>

<script>
(function(){
  'use strict';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx=0,ty=0,cx=0,cy=0;
  addEventListener('mousemove',function(e){
    tx=(e.clientX/innerWidth-0.5)*2;
    ty=(e.clientY/innerHeight-0.5)*2;
  },{passive:true});
  (function loop(){
    cx+=(tx-cx)*0.06; cy+=(ty-cy)*0.06;
    document.documentElement.style.setProperty('--mx',cx.toFixed(4));
    document.documentElement.style.setProperty('--my',cy.toFixed(4));
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
