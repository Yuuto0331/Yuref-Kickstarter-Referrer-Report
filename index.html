  <meta name="description" content="Kickstarter / Indiegogo / Makuake 众筹出单渠道分析工具统一入口">
  <meta name="theme-color" content="#ffffff">
  <style>
    /* ===== shadcn/ui 语义 token（neutral，亮/暗双模式） ===== */
    :root{
      --radius:0.625rem;
      --radius-sm:calc(var(--radius)*0.6);
      --radius-md:calc(var(--radius)*0.8);
      --radius-lg:var(--radius);
      --radius-xl:calc(var(--radius)*1.4);
      --radius-2xl:calc(var(--radius)*1.8);
      --background:oklch(1 0 0);
      --foreground:oklch(0.145 0 0);
      --card:oklch(1 0 0);
      --card-foreground:oklch(0.145 0 0);
      --primary:oklch(0.205 0 0);
      --primary-foreground:oklch(0.985 0 0);
      --secondary:oklch(0.97 0 0);
      --secondary-foreground:oklch(0.205 0 0);
      --muted:oklch(0.97 0 0);
      --muted-foreground:oklch(0.556 0 0);
      --accent:oklch(0.97 0 0);
      --accent-foreground:oklch(0.205 0 0);
      --border:oklch(0.922 0 0);
      --ring:oklch(0.708 0 0);
      /* 平台品牌色（仅点睛：圆点/徽标，不做大色块） */
      --ks:oklch(0.72 0.17 156);
      --igg:oklch(0.62 0.22 0);
      --mk:oklch(0.83 0.16 95);
    }
    .dark{
      --background:oklch(0.145 0 0);
      --foreground:oklch(0.985 0 0);
      --card:oklch(0.205 0 0);
      --card-foreground:oklch(0.985 0 0);
      --primary:oklch(0.922 0 0);
      --primary-foreground:oklch(0.205 0 0);
      --secondary:oklch(0.269 0 0);
      --secondary-foreground:oklch(0.985 0 0);
      --muted:oklch(0.269 0 0);
      --muted-foreground:oklch(0.708 0 0);
      --accent:oklch(0.269 0 0);
      --accent-foreground:oklch(0.985 0 0);
      --border:oklch(1 0 0 / 10%);
      --ring:oklch(0.556 0 0);
      --ks:oklch(0.75 0.17 156);
      --igg:oklch(0.68 0.2 0);
      --mk:oklch(0.85 0.15 95);
    }
    @media (prefers-color-scheme: dark){
      :root{ /* 跟随系统时等价 .dark */
        --background:oklch(0.145 0 0);
        --foreground:oklch(0.985 0 0);
        --card:oklch(0.205 0 0);
        --card-foreground:oklch(0.985 0 0);
        --primary:oklch(0.922 0 0);
        --primary-foreground:oklch(0.205 0 0);
        --secondary:oklch(0.269 0 0);
        --secondary-foreground:oklch(0.985 0 0);
        --muted:oklch(0.269 0 0);
        --muted-foreground:oklch(0.708 0 0);
        --accent:oklch(0.269 0 0);
        --accent-foreground:oklch(0.985 0 0);
        --border:oklch(1 0 0 / 10%);
        --ring:oklch(0.556 0 0);
        --ks:oklch(0.75 0.17 156);
        --igg:oklch(0.68 0.2 0);
        --mk:oklch(0.85 0.15 95);
      }
    }

    *{box-sizing:border-box;margin:0;padding:0}
    /* ===== 背景动效：三个大光斑独立漂浮 + 鼠标视差 ===== */
    .bgfx{
      position:fixed;inset:-14%;pointer-events:none;z-index:0;
      transform:translate(calc(var(--mx,0)*2.4%),calc(var(--my,0)*2.4%));
    }
    .blob{position:absolute;border-radius:50%;filter:blur(64px);will-change:transform}
    .blob.b1{width:46vmax;height:46vmax;left:-6%;top:-16%;opacity:.5;
      background:radial-gradient(circle at 42% 42%,var(--ks) 0%,transparent 64%);
      animation:fl1 11s ease-in-out infinite alternate}
    .blob.b2{width:44vmax;height:44vmax;right:-8%;top:-14%;opacity:.5;
      background:radial-gradient(circle at 58% 42%,var(--igg) 0%,transparent 64%);
      animation:fl2 15s ease-in-out infinite alternate}
    .blob.b3{width:54vmax;height:54vmax;left:16%;bottom:-30%;opacity:.52;
      background:radial-gradient(circle at 50% 58%,var(--mk) 0%,transparent 64%);
      animation:fl3 18s ease-in-out infinite alternate}
    @keyframes fl1{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,6vmax) scale(1.2)}}
    @keyframes fl2{from{transform:translate(0,0) scale(1.12)}to{transform:translate(-8vmax,7vmax) scale(.9)}}
    @keyframes fl3{from{transform:translate(0,0) scale(1)}to{transform:translate(7vmax,-9vmax) scale(1.16)}}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      background:var(--background);color:var(--foreground);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:40px 20px;
    }
    .wrap{width:100%;max-width:880px;position:relative;z-index:1}

    /* ===== Hero ===== */
    .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:46px}
    .badge{
      display:inline-flex;align-items:center;gap:6px;
      font-size:12.5px;font-weight:600;letter-spacing:.4px;
      color:var(--muted-foreground);
      border:1px solid var(--border);border-radius:9999px;
      padding:5px 15px;margin-bottom:18px;
    }
    .badge .bdot{width:6px;height:6px;border-radius:50%;display:inline-block;animation:bdPulse 2s ease-in-out infinite}
    .bdot.ks{background:var(--ks)}
    .bdot.igg{background:var(--igg);animation-delay:.35s}
    .bdot.mk{background:var(--mk);animation-delay:.7s}
    @keyframes bdPulse{0%,100%{opacity:1;scale:1}50%{opacity:.3;scale:.72}}
    h1{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:700;letter-spacing:-0.4px}
    /* 三色均衡器 logo：柱子持续跳动 */
    .logomark{
      width:54px;height:54px;border-radius:13px;flex:none;
      background:linear-gradient(135deg,#86efac,#f9a8d4,#fde68a);
      box-shadow:0 1px 3px oklch(0.145 0 0 / 16%);
      display:flex;align-items:flex-end;justify-content:center;gap:5px;padding-bottom:14px;
    }
    .logomark .bar{width:6px;border-radius:3px;background:#fff;transform-origin:bottom;animation:eq 1.7s ease-in-out infinite}
    .logomark .bar1{height:16px}
    .logomark .bar2{height:26px;animation-delay:.4s}
    .logomark .bar3{height:10px;animation-delay:.8s}
    @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
    h1 .thin{color:var(--foreground);font-weight:600}
    .sub{margin-top:12px;color:var(--muted-foreground);font-size:15px}

    /* ===== 卡片（shadcn Card：rounded-xl border bg-card） ===== */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
    .card{
      position:relative;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--card-foreground);
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius-xl);padding:32px 36px;
      opacity:0;translate:0 18px;
      animation:cardEnter .6s cubic-bezier(.2,.7,.3,1) forwards;
      transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
    }
    .card:nth-child(1){animation-delay:.08s}
    .card:nth-child(2){animation-delay:.18s}
    .card:nth-child(3){animation-delay:.28s}
    @keyframes cardEnter{to{opacity:1;translate:0 0}}
    .card:hover{
      border-color:var(--ring);
      box-shadow:0 8px 24px oklch(0.145 0 0 / 12%);
      transform:translateY(-4px);
    }
    /* 每张卡铺一层淡淡的平台专属色，边框也微微带色（暗色模式自动适配） */
    #cardKS{background:linear-gradient(180deg,color-mix(in oklab,var(--ks) 12%,var(--card)),var(--card) 78%);border-color:color-mix(in oklab,var(--ks) 22%,var(--border))}
    #cardIGG{background:linear-gradient(180deg,color-mix(in oklab,var(--igg) 10%,var(--card)),var(--card) 78%);border-color:color-mix(in oklab,var(--igg) 20%,var(--border))}
    #cardMK{background:linear-gradient(180deg,color-mix(in oklab,var(--mk) 13%,var(--card)),var(--card) 78%);border-color:color-mix(in oklab,var(--mk) 26%,var(--border))}
    /* hover 时用平台品牌色点亮边框与光晕 */
    #cardKS:hover{border-color:var(--ks);box-shadow:0 10px 32px oklch(0.72 0.17 156 / 28%)}
    #cardIGG:hover{border-color:var(--igg);box-shadow:0 10px 32px oklch(0.62 0.22 0 / 26%)}
    #cardMK:hover{border-color:var(--mk);box-shadow:0 10px 32px oklch(0.83 0.16 95 / 34%)}
    .card-head{display:flex;flex-direction:column;align-items:center;gap:12px}
    .plogo{
      width:50px;height:50px;border-radius:13px;flex:none;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:19px;color:#fff;
    }
    .plogo.ks{background:var(--ks)}
    .plogo.igg{background:var(--igg);font-size:11px;letter-spacing:.3px}
    .plogo.mk{background:var(--mk);color:#3a2c00}
    .plogo.imgmk{background:#fff;border:1px solid var(--border)}
    .plogo.imgmk img{width:38px;height:38px;display:block;border-radius:9px}
    .plogo.imgigg{background:#fff;border:1px solid var(--border)}
    .plogo.imgigg img{width:38px;height:38px;display:block;border-radius:9px}
    .dot{display:none}
    .pname{font-weight:600;font-size:15.5px;letter-spacing:-0.1px}
    .tag{
      font-size:10.5px;font-weight:600;letter-spacing:.5px;
      color:var(--muted-foreground);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:2px 8px;
    }
    .arrow{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      color:var(--muted-foreground);opacity:.45;display:flex;
      animation:arrowNudge 2.4s ease-in-out infinite;
      transition:opacity .15s ease,color .15s ease;
    }
    @keyframes arrowNudge{0%,100%{translate:0 0}50%{translate:4px 0}}
    .card:hover .arrow{opacity:1;color:var(--foreground);animation-play-state:paused}

    .foot{text-align:center;color:var(--muted-foreground);font-size:12.5px;margin-top:44px}

    /* 系统开启「减少动态效果」时全部动画停用，内容直接可见 */
    @media (prefers-reduced-motion: reduce){
      .blob,.logomark .bar,.bdot,.arrow{animation:none!important}
      .card{opacity:1;translate:0 0;animation:none!important}
    }
  </style>
</head>

<script>
(function(){
  'use strict';
  var tx=0,ty=0,cx=0,cy=0;
  addEventListener('mousemove',function(e){
    tx=(e.clientX/innerWidth-0.5)*2;
    ty=(e.clientY/innerHeight-0.5)*2;
  },{passive:true});
  addEventListener('touchmove',function(e){
    if(e.touches&&e.touches[0]){
      tx=(e.touches[0].clientX/innerWidth-0.5)*2;
      ty=(e.touches[0].clientY/innerHeight-0.5)*2;
    }
  },{passive:true});
  (function loop(){
    cx+=(tx-cx)*0.09; cy+=(ty-cy)*0.09;
    document.documentElement.style.setProperty('--mx',cx.toFixed(4));
    document.documentElement.style.setProperty('--my',cy.toFixed(4));
    requestAnimationFrame(loop);
  })();
  /* 入场动画安全网：1.4s 后若卡片仍未显形（动画异常/被拦截），强制显示 */
  setTimeout(function(){
    var cards=document.querySelectorAll('.card');
    for(var i=0;i<cards.length;i++){
      if(parseFloat(getComputedStyle(cards[i]).opacity)<0.99){
        cards[i].style.animation='none';
        cards[i].style.opacity='1';
        cards[i].style.translate='0 0';
      }
    }
  },1400);
})();
</script>
